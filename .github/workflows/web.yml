name: Web de indicadores (GitHub Pages)

# Publica la app como sitio web en GitHub Pages. La URL del proyecto Supabase y la llave anon van en
# el paso "Compilar sitio"; la llave anon es pública por diseño de Supabase y la seguridad depende de
# las políticas de la base, no de esconder esta llave.
#
# Dos trabajos, como recomienda GitHub: "compilar" prueba, compila y sube el paquete del sitio;
# "publicar" lo despliega en otra máquina cuando el primero termina. Con un solo trabajo, el paso de
# despliegue buscaba el paquete medio segundo después de subirlo y a veces GitHub todavía no lo
# listaba ("No artifacts named github-pages were found").
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore: ['docs/**', 'tools/**', 'supabase/**', '**.md']

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  compilar:
    runs-on: ubuntu-latest
    outputs:
      listo: ${{ steps.pages.outputs.listo }}
    steps:
      # Mientras GitHub Pages no esté activado (Settings > Pages > Source: GitHub Actions),
      # el flujo avisa y no publica, sin marcar error.
      - name: Verificar GitHub Pages
        id: pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh api "repos/${GITHUB_REPOSITORY}/pages" --jq .build_type 2>/dev/null | grep -q workflow; then
            echo "listo=si" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::No se publica: active Settings > Pages > Build and deployment > Source: GitHub Actions"
            echo "listo=no" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.pages.outputs.listo == 'si'
        uses: actions/checkout@v4
      - if: steps.pages.outputs.listo == 'si'
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - if: steps.pages.outputs.listo == 'si'
        run: npm ci --no-audit --no-fund
      - name: Probar
        if: steps.pages.outputs.listo == 'si'
        run: npm test
      - name: Compilar sitio
        if: steps.pages.outputs.listo == 'si'
        # La URL del proyecto y la llave anon son públicas por diseño de Supabase: van dentro
        # de la página publicada de todos modos. Sin sesión de administrador, las políticas
        # de la base solo permiten leer. Nunca poner aquí la llave service_role.
        env:
          VITE_SUPABASE_URL: https://sbjmjrjmfgcqpuofyjqo.supabase.co
          VITE_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNiam1qcmptZmdjcXB1b2Z5anFvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTU2NDQxOTEsImV4cCI6MjExMTIyMDE5MX0.UOxOZPWdU-QmqhKyb-NEs5njXD-ikbkw5t93WFql-es
        run: npm run build:web
      - if: steps.pages.outputs.listo == 'si'
        uses: actions/configure-pages@v6
      - if: steps.pages.outputs.listo == 'si'
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist-web

  publicar:
    needs: compilar
    if: needs.compilar.outputs.listo == 'si'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - id: despliegue
        uses: actions/deploy-pages@v5
